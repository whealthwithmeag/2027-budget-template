/* ================= BASE ================= */
*{box-sizing:border-box;}
html,body{margin:0;}
body{

a{color:var(--teal);}

button{font-family:inherit;}
input,select,textarea{font-family:inherit; font-size:14px; color:var(--ink); background:var(--paper-raised); border:1px solid var(--line-strong); border-radius:6px; padding:7px 9px;}

.app{display:flex; min-height:100vh;}

.brand-text .eyebrow{font-size:10.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--teal); font-weight:700;}

.nav-group{margin-bottom:4px;}
.nav-group.dim{opacity:.5; transition:opacity .15s ease;}

.nav-btn[aria-current="true"] svg{opacity:1;}
.rail-foot{margin-top:16px; padding-top:12px; border-top:1px solid var(--line);}

.main{flex:1; min-width:0; padding:28px 34px 60px;}

.page-head{margin-bottom:22px; display:flex; justify-content:space-between; align-items:flex-end; gap:16px; flex-wrap:wrap;}

.route{display:flex; align-items:center; gap:6px; font-size:11px; color:var(--ink-mute); letter-spacing:.04em; text-transform:uppercase; margin-bottom:6px;}
.route .dot{width:4px;height:4px;border-radius:50%;background:var(--line-strong);}

.card{
  background:var(--paper-raised);
  border:1px solid var(--line);
  border-radius:12px;
  padding:20px 22px;
  margin-bottom:18px;
  box-shadow:0 1px 2px var(--shadow);
}

.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
.grid-3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px;}

.stat{background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:14px 16px;}

.stat .delta.good{color:var(--sage);}
.stat .delta.bad{color:var(--brick);}

.pill-row{display:flex; gap:6px; flex-wrap:wrap;}
.pill{

}
.pill[aria-pressed="true"]{background:var(--teal); color:#fff; border-color:var(--teal);}
.pill:hover:not([aria-pressed="true"]){border-color:var(--ink-mute);}

.btn{

.btn.danger{color:var(--brick); border-color:var(--brick-soft);}
.btn.small{padding:5px 10px; font-size:12px;}
.btn svg{width:14px;height:14px;}

.table-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:10px;}
table.grid{font-size:13px; min-width:100%;}
table.grid th,table.grid td{padding:8px 10px; border-bottom:1px solid var(--line); white-space:nowrap;}
table.grid thead th{
  background:var(--paper-sunken); color:var(--ink-2); font-weight:600; font-size:11.5px;

}

table.grid tfoot td{font-weight:700; border-top:2px solid var(--line-strong); border-bottom:none; background:var(--paper-sunken);}

}
table.grid input.cell:hover, table.grid select.cell:hover{border-color:var(--line-strong);}
table.grid input.cell:focus, table.grid select.cell:focus{background:var(--paper); border-color:var(--focus);}

.row-del:hover{opacity:1; background:var(--brick-soft);}

.badge.warn{background:#fdecc4; color:#8a5a06;}

.badge.bad{background:var(--brick-soft); color:var(--brick);}

.divider-route{

.field{display:flex; flex-direction:column; gap:5px; margin-bottom:12px;}

.field .desc{font-size:11.5px; color:var(--ink-mute);}
.field-row{display:flex; gap:12px; flex-wrap:wrap;}
.field-row .field{flex:1; min-width:150px;}

.callout{border-left:3px solid var(--gold); background:var(--gold-soft); border-radius:0 8px 8px 0; padding:12px 14px; font-size:12.5px; color:var(--ink-2); margin-bottom:16px;}
.callout.teal{border-color:var(--teal); background:var(--teal-soft);}
.callout strong{color:var(--ink);}

.chip-toggle{display:inline-flex; border:1px solid var(--line-strong); border-radius:8px; overflow:hidden;}
.chip-toggle button{border:none; background:var(--paper-raised); color:var(--ink-2); font-size:12.5px; font-weight:600; padding:7px 13px; cursor:pointer;}
.chip-toggle button[aria-pressed="true"]{background:var(--teal); color:#fff;}

.legend{display:flex; gap:14px; font-size:12px; color:var(--ink-2); flex-wrap:wrap; margin-top:8px;}
.legend .sw{display:inline-block; width:10px;height:10px;border-radius:2px; margin-right:5px; vertical-align:-1px;}

::-webkit-scrollbar{height:8px; width:8px;}

.sr-only{position:absolute; width:1px;height:1px; overflow:hidden; clip:rect(0,0,0,0);}
.section{display:none;}
.section.active{display:block;}
.empty-state{text-align:center; padding:30px 10px; color:var(--ink-mute); font-size:13px;}

.save-note svg{width:12px;height:12px;}

.menu-btn{display:none; border:1px solid var(--line-strong); background:var(--paper-raised); border-radius:7px; padding:7px 9px; margin-bottom:14px; cursor:pointer;}
@media (max-width:760px){

var state = loadState();

function loadState(){
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    var parsed = JSON.parse(raw);
    return migrateState(parsed);
  }catch(e){ return defaultState(); }
}
function migrateCategoryShape(parsed){
  // Older saved/imported data has a single flat `budget` number per category. Upgrade it to
  // budgetQ (one number per quarter, seeded with the old flat value so nothing changes on
  // load) and activeQ (all quarters on, matching the old "always on" behavior) in place, so
  // the array-wholesale-replace in deepMerge below picks up the new shape instead of the old
  // one. Never touches actuals, so no logged numbers are at risk here.
  if(!parsed || !parsed.categories) return;
  Object.keys(parsed.categories).forEach(function(group){
    var list = parsed.categories[group];
    if(!Array.isArray(list)) return;
    list.forEach(function(c){
      if(!c || typeof c!=="object") return;
      if(!c.budgetQ || typeof c.budgetQ!=="object"){
        var flat = Number(c.budget)||0;
        c.budgetQ = {q1:flat, q2:flat, q3:flat, q4:flat};
      }
      if(!c.activeQ || typeof c.activeQ!=="object"){
        c.activeQ = {q1:true, q2:true, q3:true, q4:true};
      }
      delete c.budget;
    });
  });
}
function migrateState(parsed){
  migrateCategoryShape(parsed);
  var fresh = defaultState();
  function deepMerge(base, incoming){
    if(Array.isArray(base)) return incoming!==undefined ? incoming : base;
    if(typeof base === "object" && base!==null){
      var out = {};
      var keys = Object.keys(base);
      // Dictionaries keyed by generated ids (actuals, expenseActuals, assets, liabilities)
      // get fresh random ids on every defaultState() call, which never match a previously
      // saved id. Without this, every reload/import would silently drop all stored amounts
      // for any category whose id doesn't happen to match the newly-generated defaults.
      // Unioning in incoming's own keys keeps data keyed by the ids that are actually in use.
      if(incoming && typeof incoming === "object" && !Array.isArray(incoming)){
        Object.keys(incoming).forEach(function(k){ if(keys.indexOf(k)===-1) keys.push(k); });
      }
      keys.forEach(function(k){
        if(Object.prototype.hasOwnProperty.call(base, k)){
          out[k] = deepMerge(base[k], incoming ? incoming[k] : undefined);
        } else {
          out[k] = incoming[k];
        }
      });
      return out;
    }
    return incoming!==undefined ? incoming : base;
  }
  try{ return deepMerge(fresh, parsed); }catch(e){ return fresh; }
}

var undoStack = [];
var UNDO_MAX = 30;
function pushUndo(){
  try{
    undoStack.push(JSON.stringify(state));
    if(undoStack.length > UNDO_MAX) undoStack.shift();
    refreshUndoBtn();
  }catch(e){ /* snapshot failed - skip, undo just won't have this step */ }
}
function doUndo(){
  if(!undoStack.length) return;
  try{
    var prev = JSON.parse(undoStack.pop());
    state = migrateState(prev);
    saveState();
    renderNav();
    renderMain();
    refreshUndoBtn();
    // runs just after saveState's own debounced "Saved just now" flash, so this message wins
    setTimeout(flashUndone, 300);
  }catch(e){ /* corrupt snapshot - drop it, leave state as-is */ }
}
function refreshUndoBtn(){
  var b = document.getElementById("btnUndo");
  if(b) b.disabled = undoStack.length===0;
}
function flashUndone(){
  var el = document.getElementById("saveNote");
  if(!el) return;
  el.textContent = "Last change undone";
  clearTimeout(flashSaved._t);
  flashSaved._t = setTimeout(function(){ el.textContent = "Saved on this device"; }, 1800);
}

function freelanceRateCalc(){
  var f = state.freelanceRate;
  var target = Number(f.targetIncome)||0;
  var expenses = Number(f.annualExpenses)||0;
  var bufferPct = clamp(Number(f.taxBufferPct)||0, 0, 95);
  var hours = Number(f.hoursPerWeek)||0;
  var weeks = Number(f.weeksPerYear)||0;
  var billableHours = hours*weeks;
  var grossNeeded = (target+expenses) / (1-(bufferPct/100));
  var hourlyRate = billableHours>0 ? grossNeeded/billableHours : 0;
  return {billableHours:billableHours, grossNeeded:grossNeeded, hourlyRate:hourlyRate};
}

/* ============================================================
   DEBT PAYOFF CALCULATOR
   ============================================================ */
function monthsFromNowLabel(months){
  if(!months) return "";
  var d = new Date();
  d.setMonth(d.getMonth()+months);
  return d.toLocaleDateString("en-US",{month:"long", year:"numeric"});
}
function simulateDebtPayoff(debts, strategy, extraMonthly){
  var list = (debts||[]).map(function(d){
    return {id:d.id, balance:Number(d.balance)||0, apr:Number(d.apr)||0, minPayment:Number(d.minPayment)||0};
  }).filter(function(d){ return d.balance>0.005; });
  var payoffMonth = {};
  if(!list.length) return {months:0, totalInterest:0, payoffMonth:payoffMonth, hitCap:false};
  function sortOrder(arr){
    var copy = arr.slice();
    if(strategy==="snowball") copy.sort(function(a,b){ return a.balance-b.balance; });
    else copy.sort(function(a,b){ return b.apr-a.apr; });
    return copy;
  }
  var totalInterest = 0, months = 0;
  var extra = Number(extraMonthly)||0;
  var MAX_MONTHS = 600; // 50-year safety cap, in case minimums never cover accruing interest
  while(list.some(function(d){ return d.balance>0.005; }) && months<MAX_MONTHS){
    months++;
    list.forEach(function(d){
      if(d.balance>0.005){
        var interest = d.balance*((d.apr/100)/12);
        d.balance += interest;
        totalInterest += interest;
      }
    });
    list.forEach(function(d){
      if(d.balance>0.005) d.balance -= Math.min(d.minPayment, d.balance);
    });
    var ordered = sortOrder(list.filter(function(d){ return d.balance>0.005; }));
    var remainingExtra = extra;
    for(var i=0;i<ordered.length && remainingExtra>0.005;i++){
      var pay = Math.min(remainingExtra, ordered[i].balance);
      ordered[i].balance -= pay;
      remainingExtra -= pay;
    }
    list.forEach(function(d){
      if(d.balance<=0.005 && payoffMonth[d.id]===undefined) payoffMonth[d.id] = months;
    });
  }
  return {months:months, totalInterest:totalInterest, payoffMonth:payoffMonth, hitCap: months>=MAX_MONTHS};
}

/* ============================================================
   TAX ENGINE
   ============================================================ */
function calcBracketTax(taxableIncome, brackets){
  taxableIncome = Math.max(0, taxableIncome);
  var tax = 0;
  for(var i=0;i<brackets.length;i++){
    var lower = brackets[i][0];
    var rate = brackets[i][1];
    var upper = (i+1<brackets.length) ? brackets[i+1][0] : Infinity;
    if(taxableIncome > lower){
      tax += (Math.min(taxableIncome, upper) - lower) * rate;
    } else break;
  }
  return tax;
}

function computeTaxSummary(){
  var t = state.tax;
  var netSE = t.useProjection ? (Number(t.projectedAnnualNetSE)||0) : seNetAnnual();
  netSE = Math.max(0, netSE);
  var seTaxableBase = netSE * 0.9235;
  var wageBase = Number(t.seWageBase)||0;
  var ssPortion = Math.min(seTaxableBase, wageBase) * 0.124;
  var medicarePortion = seTaxableBase * 0.029;
  var addlThreshold = (t.addlMedicareThreshold[t.filingStatus]!==undefined) ? t.addlMedicareThreshold[t.filingStatus] : t.addlMedicareThreshold.single;
  var combinedWageForAddl = (Number(t.w2Wages)||0) + seTaxableBase;
  var addlMedicare = Math.max(0, combinedWageForAddl - addlThreshold) * 0.009;
  var seTax = ssPortion + medicarePortion + addlMedicare;
  var halfSEDeduction = seTax * 0.5;

  var stdDed = Number(t.standardDeduction[t.filingStatus]) || 0;
  var grossIncome = (Number(t.w2Wages)||0) + netSE;
  var taxableIncome = Math.max(0, grossIncome - halfSEDeduction - stdDed);
  var brackets = t.brackets[t.filingStatus] || t.brackets.single;
  var incomeTax = calcBracketTax(taxableIncome, brackets);

  var totalTax = incomeTax + seTax;
  var netOfWithholding = Math.max(0, totalTax - (Number(t.w2Withholding)||0));

  var safeHarborPrior = (Number(t.priorYearAGI)||0) > t.safeHarborAgiThreshold ? (Number(t.priorYearTax)||0)*1.10 : (Number(t.priorYearTax)||0);
  var safeHarborCurrent = totalTax * 0.9;
  var requiredAnnualPayment = t.method==="priorYear" ? Math.min(safeHarborPrior, netOfWithholding) : Math.min(safeHarborCurrent, netOfWithholding);
  if(t.method==="priorYear" && (!t.priorYearTax || t.priorYearTax<=0)) requiredAnnualPayment = netOfWithholding;

  return {
    netSE:netSE, seTaxableBase:seTaxableBase, ssPortion:ssPortion, medicarePortion:medicarePortion,
    addlMedicare:addlMedicare, seTax:seTax, halfSEDeduction:halfSEDeduction, stdDed:stdDed,
    taxableIncome:taxableIncome, incomeTax:incomeTax, totalTax:totalTax, netOfWithholding:netOfWithholding,
    safeHarborPrior:safeHarborPrior, safeHarborCurrent:safeHarborCurrent, requiredAnnualPayment:requiredAnnualPayment
  };
}

function taxPaidThrough(periodId){
  var idx = TAX_PERIODS.findIndex(function(p){ return p.id===periodId; });
  var total = 0;
  for(var i=0;i<=idx;i++){ total += Number(state.taxQuarters[TAX_PERIODS[i].id].paid)||0; }
  return total;
}

/* ============================================================
   CHART HELPERS (SVG)
   ============================================================ */
function svgLineChart(opts){
  // opts: {series:[{label,color,values:[12 nums]}], labels:[12], height, width, money:true}
  var w = opts.width||640, h = opts.height||220, pad = {t:16,r:14,b:26,l:44};
  var innerW = w-pad.l-pad.r, innerH = h-pad.t-pad.b;
  var allVals = [];
  opts.series.forEach(function(s){ allVals = allVals.concat(s.values); });
  var max = Math.max.apply(null, allVals.concat([0]));
  var min = Math.min.apply(null, allVals.concat([0]));
  var flat = (max===min);
  if(flat){ max = max+1; }
  var n = opts.labels.length;
  function x(i){ return pad.l + (n<=1?0:(innerW*i/(n-1))); }
  function y(v){ return pad.t + innerH - ((v-min)/(max-min))*innerH; }
  var gridLines = 4, gridHtml = "";
  for(var g=0; g<=gridLines; g++){
    var gv = min + (max-min)*g/gridLines;
    var gy = y(gv);
    gridHtml += '<line x1="'+pad.l+'" x2="'+(w-pad.r)+'" y1="'+gy+'" y2="'+gy+'" stroke="var(--c-grid)" stroke-width="1"/>';
    gridHtml += '<text x="'+(pad.l-8)+'" y="'+(gy+3)+'" font-size="9.5" text-anchor="end" fill="var(--c-mute)" font-family="IBM Plex Mono, monospace">'+(flat?"":(opts.money?fmtCompact(gv):Math.round(gv)))+'</text>';
  }
  if(flat) gridHtml += '<text x="'+(pad.l-8)+'" y="'+(y(min)+3)+'" font-size="9.5" text-anchor="end" fill="var(--c-mute)" font-family="IBM Plex Mono, monospace">'+(opts.money?fmtCompact(min):Math.round(min))+'</text>';
  var zeroY = y(0);
  gridHtml += '<line x1="'+pad.l+'" x2="'+(w-pad.r)+'" y1="'+zeroY+'" y2="'+zeroY+'" stroke="var(--c-axis)" stroke-width="1.2"/>';
  var labelHtml = "";
  opts.labels.forEach(function(lb,i){
    if(n>12 && i%2!==0) return;
    labelHtml += '<text x="'+x(i)+'" y="'+(h-8)+'" font-size="9.5" text-anchor="middle" fill="var(--c-mute)">'+lb+'</text>';
  });
  var seriesHtml = "";
  opts.series.forEach(function(s){
    var pts = s.values.map(function(v,i){ return x(i)+","+y(v); }).join(" ");
    seriesHtml += '<polyline points="'+pts+'" fill="none" stroke="'+s.color+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
    s.values.forEach(function(v,i){
      seriesHtml += '<circle cx="'+x(i)+'" cy="'+y(v)+'" r="2.6" fill="'+s.color+'"><title>'+s.label+", "+opts.labels[i]+": "+(opts.money?fmtMoney(v):v)+'</title></circle>';
    });
  });
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" style="max-width:'+w+'px" role="img" aria-label="'+(opts.ariaLabel||"chart")+'">'+gridHtml+seriesHtml+labelHtml+'</svg>';
}

function svgBarChart(opts){
  // opts: {groups:[{label, bars:[{label,color,value}]}], height,width,money}
  var w = opts.width||640, h = opts.height||220, pad={t:16,r:14,b:26,l:44};
  var innerW=w-pad.l-pad.r, innerH=h-pad.t-pad.b;
  var allVals=[]; opts.groups.forEach(function(g){ g.bars.forEach(function(b){ allVals.push(b.value); }); });
  var max = Math.max.apply(null, allVals.concat([0]));
  var min = Math.min.apply(null, allVals.concat([0]));
  var flat = (max===min);
  if(flat) max=max+1;
  var range = max-min || 1;
  function y(v){ return pad.t + innerH - ((v-min)/range)*innerH; }
  var zeroY = y(0);
  var groupW = innerW/opts.groups.length;
  var barsPerGroup = opts.groups[0] ? opts.groups[0].bars.length : 1;
  var barGap = 3, groupPad = 10;
  var barW = Math.max(4,(groupW - groupPad*2 - barGap*(barsPerGroup-1))/barsPerGroup);
  var gridHtml="";
  for(var gl=0; gl<=4; gl++){
    var gv = min+range*gl/4, gy=y(gv);
    gridHtml += '<line x1="'+pad.l+'" x2="'+(w-pad.r)+'" y1="'+gy+'" y2="'+gy+'" stroke="var(--c-grid)" stroke-width="1"/>';
    gridHtml += '<text x="'+(pad.l-8)+'" y="'+(gy+3)+'" font-size="9.5" text-anchor="end" fill="var(--c-mute)" font-family="IBM Plex Mono, monospace">'+(flat?"":(opts.money?fmtCompact(gv):Math.round(gv)))+'</text>';
  }
  if(flat) gridHtml += '<text x="'+(pad.l-8)+'" y="'+(zeroY+3)+'" font-size="9.5" text-anchor="end" fill="var(--c-mute)" font-family="IBM Plex Mono, monospace">'+(opts.money?fmtCompact(0):0)+'</text>';
  gridHtml += '<line x1="'+pad.l+'" x2="'+(w-pad.r)+'" y1="'+zeroY+'" y2="'+zeroY+'" stroke="var(--c-axis)" stroke-width="1.2"/>';
  var barsHtml="", labelHtml="";
  opts.groups.forEach(function(gp,gi){
    var gx0 = pad.l + gi*groupW + groupPad;
    labelHtml += '<text x="'+(pad.l+gi*groupW+groupW/2)+'" y="'+(h-8)+'" font-size="9.5" text-anchor="middle" fill="var(--c-mute)">'+gp.label+'</text>';
    gp.bars.forEach(function(b,bi){
      var bx = gx0 + bi*(barW+barGap);
      var by = Math.min(y(b.value), zeroY);
      var bh = Math.abs(y(b.value)-zeroY);
      barsHtml += '<rect x="'+bx+'" y="'+by+'" width="'+barW+'" height="'+Math.max(bh,0.5)+'" rx="2" fill="'+b.color+'"><title>'+gp.label+", "+b.label+": "+(opts.money?fmtMoney(b.value):b.value)+'</title></rect>';
    });
  });
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" style="max-width:'+w+'px" role="img" aria-label="'+(opts.ariaLabel||"chart")+'">'+gridHtml+barsHtml+labelHtml+'</svg>';
}

function svgDonut(pct, color, size){
  size = size||120;
  var r = size/2-10, c = size/2;
  var circ = 2*Math.PI*r;
  var offset = circ*(1-clamp(pct,0,1));
  return '<svg viewBox="0 0 '+size+' '+size+'" width="'+size+'" height="'+size+'">'+
    '<circle cx="'+c+'" cy="'+c+'" r="'+r+'" fill="none" stroke="var(--c-grid)" stroke-width="11"/>'+
    '<circle cx="'+c+'" cy="'+c+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="11" stroke-linecap="round" stroke-dasharray="'+circ+'" stroke-dashoffset="'+offset+'" transform="rotate(-90 '+c+' '+c+')"/>'+
    '<text x="'+c+'" y="'+(c+5)+'" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="18" font-weight="600" fill="var(--ink)">'+Math.round(pct*100)+'%</text>'+
    '</svg>';
}

function fmtCompact(n){
  n = Number(n)||0;
  var neg = n<0; n = Math.abs(n);
  var s;
  if(n>=1000000) s = (n/1000000).toFixed(1)+"M";
  else if(n>=1000) s = (n/1000).toFixed(n>=10000?0:1)+"k";
  else s = n.toFixed(0);
  return (neg?"-$":"$")+s;
}

/* ============================================================

function getScope(scope){
  if(scope.indexOf("group:")===0){
    var g = scope.slice(6);
    return {cats:state.categories[g], acts:state.actuals[g], budget:true, group:g};
  }
  if(scope==="se-expense") return {cats:state.selfEmployed.expenseCats, acts:state.selfEmployed.expenseActuals, budget:false};
  if(scope==="nw-asset") return {cats:state.netWorth.assetCats, acts:state.netWorth.assets, budget:false};
  if(scope==="nw-liability") return {cats:state.netWorth.liabilityCats, acts:state.netWorth.liabilities, budget:false};
}

function isAutoSeIncomeCat(scope, c){
  return scope==="group:income" && /self-employ/i.test(c.label);
}

function renderMatrixTable(scope, opts){
  opts = opts || {};
  var sc = getScope(scope);
  var cats = sc.cats, acts = sc.acts;
  // The six Monthly Tracker groups (group:income, group:fixed, etc.) have their categories,
  // names and budget targets managed on the Budget Setup page instead — this table is actuals
  // entry only, so categories can't also be renamed/added/removed from here. Business Expenses
  // and Net Worth have no separate setup page, so they keep full category editing right here.
  var lockStructure = scope.indexOf("group:")===0;
  var showBudgetCol = sc.budget && !lockStructure;
  var html = '<div class="table-wrap"><table class="grid" data-matrix="'+scope+'">';
  html += '<thead><tr><th>Category'+(showBudgetCol?'<div style="font-weight:400;text-transform:none;font-size:10.5px;margin-top:2px;">monthly budget →</div>':'')+'</th>';
  if(showBudgetCol) html += '<th>Budget</th>';
  MONTHS.forEach(function(m){ html += '<th>'+MONTH_SHORT[m]+'</th>'; });
  html += '<th>Total</th><th></th></tr></thead><tbody>';
  cats.forEach(function(c){
    var isAuto = isAutoSeIncomeCat(scope, c);
    html += '<tr'+(isAuto?' style="background:var(--paper-sunken);"':'')+'>';
    if(isAuto){
      html += '<td><div class="row-label-static" title="This row is pulled automatically from your Business Income page and can\'t be renamed or edited here.">'+escHtml(c.label)+'</div><div class="hint" style="margin:3px 0 0;font-size:11px;">This income is logged on the Business Income tab, do not enter it here.</div></td>';
    } else if(lockStructure){
      html += '<td><div class="row-label-static" title="Renamed, added, or removed on the Budget Setup page.">'+escHtml(c.label)+'</div></td>';
    } else {
      html += '<td><input class="row-label-input" data-role="label" data-scope="'+scope+'" data-cat="'+c.id+'" value="'+escAttr(c.label)+'"></td>';
    }
    if(showBudgetCol){
      html += '<td><input class="cell num-input" type="number" step="1" data-role="budget" data-scope="'+scope+'" data-cat="'+c.id+'" value="'+(c.budget||0)+'"></td>';
    }
    MONTHS.forEach(function(m){
      if(isAuto){
        var av = seIncomeMonthTotal(m);
        html += '<td><span class="cell num-input" style="display:inline-block;width:74px;color:var(--ink-2);" title="Auto-pulled from Business Income, logged there instead">'+(av?fmtMoney(av):"—")+'</span></td>';
      } else {
        var v = (acts[c.id]||{})[m]||0;
        var inQuarter = lockStructure ? catIsActiveInQuarter(c, monthToQuarter(m)) : true;
        if(!inQuarter && !v){
          html += '<td><span class="cell num-input" style="display:inline-block;width:74px;color:var(--ink-mute);" title="Not set up for this quarter - add it back on Budget Setup to log an amount here">—</span></td>';
        } else {
          html += '<td><input class="cell num-input" type="number" step="0.01" data-role="cell" data-scope="'+scope+'" data-cat="'+c.id+'" data-month="'+m+'" value="'+(v||"")+'" placeholder="0"'+(inQuarter?'':' style="opacity:.6;" title="Not set up for this quarter, but keeping this already-logged amount visible and editable"')+'></td>';
        }
      }
    });
    var rowTotal = isAuto ? seIncomeAnnualTotal() : sumMonthMap(acts[c.id]||{});
    html += '<td class="num" data-role="rowtotal" data-cat="'+c.id+'">'+fmtMoney(rowTotal)+'</td>';
    html += '<td>'+((isAuto||lockStructure)?'':'<button class="row-del" data-role="del-cat" data-scope="'+scope+'" data-cat="'+c.id+'" aria-label="Remove category" title="Remove">'+ic("x")+'</button>')+'</td>';
    html += '</tr>';
  });
  html += '</tbody><tfoot><tr><td>Total</td>';
  if(showBudgetCol){
    var budTotal = cats.reduce(function(a,c){return a+(isAutoSeIncomeCat(scope,c)?0:(Number(c.budget)||0));},0);
    html += '<td class="num">'+fmtMoney(budTotal)+'</td>';
  }
  MONTHS.forEach(function(m){
    var colTotal = cats.reduce(function(a,c){
      if(isAutoSeIncomeCat(scope,c)) return a+seIncomeMonthTotal(m);
      return a+(Number((acts[c.id]||{})[m])||0);
    },0);
    html += '<td class="num" data-role="coltotal" data-month="'+m+'">'+fmtMoney(colTotal)+'</td>';
  });
  var grand = cats.reduce(function(a,c){
    if(isAutoSeIncomeCat(scope,c)) return a+seIncomeAnnualTotal();
    return a+sumMonthMap(acts[c.id]||{});
  },0);
  html += '<td class="num" data-role="grandtotal">'+fmtMoney(grand)+'</td><td></td></tr></tfoot></table></div>';
  if(!lockStructure){
    html += '<div style="margin-top:10px;"><button class="btn small" data-role="add-cat" data-scope="'+scope+'">'+ic("plus")+' Add category</button></div>';
  }
  return html;
}

function addCategory(scope, quarterId){
  var sc = getScope(scope);
  var id = uid();
  if(scope.indexOf("group:")===0){
    var activeQ = {q1:false,q2:false,q3:false,q4:false};
    activeQ[quarterId||"q1"] = true;
    sc.cats.push({id:id, label:"New category", budgetQ:{q1:0,q2:0,q3:0,q4:0}, activeQ:activeQ});
  } else {
    sc.cats.push({id:id, label:"New category", budget:0});
  }
  sc.acts[id] = blankMonthMap();
}
function delCategory(scope, catId){
  var sc = getScope(scope);
  sc.cats.splice(sc.cats.findIndex(function(c){return c.id===catId;}),1);
  delete sc.acts[catId];
}
// Removing a category from one quarter on Budget Setup never deletes it or its logged
// actuals - it just turns it off for that quarter, so it stays safe in any other quarter
// it's active in (and can be turned back on later from the "not used this quarter" list).
function deactivateCategoryForQuarter(scope, catId, quarterId){
  var sc = getScope(scope);
  var cat = sc.cats.find(function(c){ return c.id===catId; });
  if(cat){
    if(!cat.activeQ) cat.activeQ = {q1:true,q2:true,q3:true,q4:true};
    cat.activeQ[quarterId] = false;
  }
}
function activateCategoryForQuarter(scope, catId, quarterId){
  var sc = getScope(scope);
  var cat = sc.cats.find(function(c){ return c.id===catId; });
  if(cat){
    if(!cat.activeQ) cat.activeQ = {q1:true,q2:true,q3:true,q4:true};
    cat.activeQ[quarterId] = true;
  }
}
function setNested(obj, path, val){
  var parts = path.split(".");
  var o = obj;
  for(var i=0;i<parts.length-1;i++){ o = o[parts[i]]; }
  o[parts[parts.length-1]] = val;
}
function getNested(obj, path){
  var parts = path.split(".");
  var o = obj;
  for(var i=0;i<parts.length;i++){ o = o[parts[i]]; if(o===undefined) return undefined; }
  return o;
}

document.addEventListener("change", function(e){
  var t = e.target;
  var role = t.getAttribute && t.getAttribute("data-role");
  if(!role) return;
  var rerender = true;
  pushUndo();

  if(role==="label"){
    var sc = getScope(t.dataset.scope);
    var cat = sc.cats.find(function(c){return c.id===t.dataset.cat;});
    if(cat) cat.label = t.value;
    rerender = false;
  } else if(role==="budget"){
    var sc2 = getScope(t.dataset.scope);
    var cat2 = sc2.cats.find(function(c){return c.id===t.dataset.cat;});
    if(cat2){
      if(t.dataset.quarter){
        if(!cat2.budgetQ) cat2.budgetQ = {q1:0,q2:0,q3:0,q4:0};
        cat2.budgetQ[t.dataset.quarter] = parseFloat(t.value)||0;
      } else {
        cat2.budget = parseFloat(t.value)||0;
      }
    }
  } else if(role==="cell"){
    var sc3 = getScope(t.dataset.scope);
    if(!sc3.acts[t.dataset.cat]) sc3.acts[t.dataset.cat] = blankMonthMap();
    sc3.acts[t.dataset.cat][t.dataset.month] = parseFloat(t.value)||0;
  } else if(role==="profile-field"){
    state.profile[t.dataset.field] = t.value;
    rerender=false;
  } else if(role==="quarterly-field"){
    state.quarterly[t.dataset.q][t.dataset.field] = t.value;
    rerender=false;
  } else if(role==="ef-field"){
    state.emergencyFund[t.dataset.field] = parseFloat(t.value)||0;
  } else if(role==="ef-c-field"){
    var c = state.emergencyFund.contributions.find(function(x){return x.id===t.dataset.id;});
    if(c) c[t.dataset.field] = (t.dataset.field==="amount") ? (parseFloat(t.value)||0) : t.value;
  } else if(role==="week-field"){
    var w = state.weekPlanner.find(function(x){return x.id===t.dataset.id;});
    if(w){ w[t.dataset.field] = (t.dataset.field==="done") ? t.checked : t.value; }
    rerender=false;
  } else if(role==="se-income-field"){
    var l = state.selfEmployed.incomeLines.find(function(x){return x.id===t.dataset.id;});
    if(l) l[t.dataset.field] = (t.dataset.field==="amount") ? (parseFloat(t.value)||0) : t.value;
  } else if(role==="tax-field"){
    var f = t.dataset.field;
    if(f==="filingStatus"){ state.tax.filingStatus = t.value; }
    else if(f.indexOf("standardDeduction.")===0){ setNested(state.tax, f, parseFloat(t.value)||0); }
    else { state.tax[f] = (t.tagName==="SELECT") ? t.value : (parseFloat(t.value)||0); }
  } else if(role==="bracket-field"){
    var b = state.tax.brackets[t.dataset.status][+t.dataset.idx];
    if(t.dataset.part==="threshold") b[0] = parseFloat(t.value)||0;
    else b[1] = (parseFloat(t.value)||0)/100;
  } else if(role==="tax-paid"){
    state.taxQuarters[t.dataset.period].paid = parseFloat(t.value)||0;
  } else if(role==="sub-field"){
    var sub = state.subscriptions.find(function(x){return x.id===t.dataset.id;});
    if(sub){
      var sf = t.dataset.field;
      if(sf==="amount") sub.amount = parseFloat(t.value)||0;
      else if(sf==="active") sub.active = t.checked;
      else if(sf==="cadence") sub.cadence = t.value;
      else sub.name = t.value;
    }
  } else if(role==="freelance-field"){
    state.freelanceRate[t.dataset.field] = parseFloat(t.value)||0;
  } else if(role==="debtpayoff-field"){
    state.debtPayoff[t.dataset.field] = parseFloat(t.value)||0;
  } else if(role==="debt-field"){
    var dbt = state.debtPayoff.debts.find(function(x){return x.id===t.dataset.id;});
    if(dbt) dbt[t.dataset.field] = (t.dataset.field==="name") ? t.value : (parseFloat(t.value)||0);
  } else {
    rerender = false;
  }

  saveState();
  if(rerender) renderMain(); else { /* light update */ }
});

document.addEventListener("click", function(e){
  var t = e.target.closest("[data-role]");
  if(!t) return;
  var role = t.getAttribute("data-role");
  var handled = true;
  if(role!=="set-month" && role!=="setup-quarter") pushUndo();

  if(role==="add-cat"){ addCategory(t.dataset.scope, t.dataset.quarter); }
  else if(role==="del-cat"){ delCategory(t.dataset.scope, t.dataset.cat); }
  else if(role==="deactivate-cat-quarter"){ deactivateCategoryForQuarter(t.dataset.scope, t.dataset.cat, t.dataset.quarter); }
  else if(role==="activate-cat-quarter"){ activateCategoryForQuarter(t.dataset.scope, t.dataset.cat, t.dataset.quarter); }
  else if(role==="setup-quarter"){ state.ui.setupQuarter = t.dataset.quarter; }
  else if(role==="profile-selfemployed"){
    var v = t.dataset.val;
    state.profile.isSelfEmployed = (v==="true") ? true : (v==="false" ? false : "mix");
  }
  else if(role==="set-month"){ state.ui.activeMonth = t.dataset.month; }
  else if(role==="ef-c-add"){ state.emergencyFund.contributions.push({id:uid(),date:"",note:"",amount:0}); }
  else if(role==="ef-c-del"){ state.emergencyFund.contributions = state.emergencyFund.contributions.filter(function(c){return c.id!==t.dataset.id;}); }
  else if(role==="se-income-add"){ state.selfEmployed.incomeLines.push({id:uid(),date:"",client:"",note:"",amount:0}); }
  else if(role==="se-income-del"){ state.selfEmployed.incomeLines = state.selfEmployed.incomeLines.filter(function(l){return l.id!==t.dataset.id;}); }
  else if(role==="bracket-add"){ state.tax.brackets[t.dataset.status].push([0,0]); }
  else if(role==="bracket-del"){ state.tax.brackets[t.dataset.status].splice(+t.dataset.idx,1); }
  else if(role==="tax-field" && t.dataset.val!==undefined){
    var f2 = t.dataset.field, v2 = t.dataset.val;
    state.tax[f2] = (v2==="true") ? true : (v2==="false" ? false : v2);
  }
  else if(role==="sub-add"){ state.subscriptions.push({id:uid(),name:"",amount:0,cadence:"monthly",active:true}); }
  else if(role==="sub-del"){ state.subscriptions = state.subscriptions.filter(function(s){return s.id!==t.dataset.id;}); }
  else if(role==="debtpayoff-strategy"){ state.debtPayoff.strategy = t.dataset.val; }
  else if(role==="debt-add"){ state.debtPayoff.debts.push({id:uid(),name:"",balance:0,apr:0,minPayment:0}); }
  else if(role==="debt-del"){ state.debtPayoff.debts = state.debtPayoff.debts.filter(function(d){return d.id!==t.dataset.id;}); }
  else { handled = false; }

  if(handled){ saveState(); renderNav(); renderMain(); }
});

   ============================================================ */
var downloadsNS = null;


function wireSettingsButtons(){
  var exportBtn = document.getElementById("btnExport");
  var importTrigger = document.getElementById("btnImportTrigger");
  var fileInput = document.getElementById("fileImport");
  var resetBtn = document.getElementById("btnReset");
  var msg = document.getElementById("importMsg");

  if(exportBtn) exportBtn.addEventListener("click", function(){
    var json = JSON.stringify(state, null, 2);
    var filename = "2027-budget-template-backup.json";
    if(downloadsNS){
      downloadsNS.save({filename:filename, data:json}).then(function(){
        msg.textContent = "Backup saved.";
      }).catch(function(err){
        if(err && err.code==="declined"){ msg.textContent = "Export cancelled."; }
        else if(triggerBrowserDownload(filename, json)){ msg.textContent = "Backup saved."; }
        else { showManualExport(json, msg); }
      });
    } else if(triggerBrowserDownload(filename, json)){
      msg.textContent = "Backup saved.";
    } else {
      showManualExport(json, msg);
    }
  });
  if(importTrigger) importTrigger.addEventListener("click", function(){ fileInput.click(); });
  if(fileInput) fileInput.addEventListener("change", function(){
    var file = fileInput.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var parsed = JSON.parse(reader.result);
        pushUndo();
        state = migrateState(parsed);
        saveState();
        renderNav(); renderMain();
        var m = document.getElementById("importMsg");
        if(m) m.textContent = "Backup imported.";
      }catch(err){
        var m2 = document.getElementById("importMsg");
        if(m2) m2.textContent = "Couldn't read that file. Make sure it's a Budget backup (.json).";
      }
    };
    reader.readAsText(file);
  });
  if(resetBtn) resetBtn.addEventListener("click", function(){
    pushUndo();
    state = defaultState();
    saveState();
    renderNav(); renderMain();
  });
}
function triggerBrowserDownload(filename, text){
  try{
    var blob = new Blob([text], {type:"application/json"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    return true;
  }catch(e){
    return false;
  }
}
function showManualExport(json, msgEl){
  var mount = document.getElementById("mainMount");
  var wrap = document.createElement("div");
  wrap.className = "card";
  wrap.innerHTML = '<h3>Copy your backup</h3><div class="hint">Direct download isn\'t available in this view. Copy everything below and save it as a .json file instead.</div><textarea style="width:100%;height:160px;font-family:\'IBM Plex Mono\',monospace;font-size:11.5px;" readonly></textarea>';
  wrap.querySelector("textarea").value = json;
  mount.insertBefore(wrap, mount.firstChild);
  if(msgEl) msgEl.textContent = "";
}
